apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  annotations:
    nginx.ingress.kubernetes.io/app-root: /web
  name: webdisplay
  namespace: default
spec:
  ingressClassName: nginx
  rules:
    - host: theoden.pjis.net
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: webdisplay-service
                port:
                  number: 3001
