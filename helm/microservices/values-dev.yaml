env: dev

apps:
  fetcher:
    enabled: false
  repeater:
    enabled: true
  webdisplay:
    env:
      - name: REACT_APP_API_URL
        value: "http://samwise.pjis.net/api"
      - name: REACT_APP_CLUSTER_DASHBOARD_URL
        value: "https://devdashboard.pjis.net/"
ingress:
  apiserver:
    host: samwise.pjis.net
  webdisplay:
    host: samwise.pjis.net
  dashboard:
    host: devdashboard.pjis.net
  
# dev-specific redis overrides
redis:
  host: redis.redis
  image: "redis:alpine"
  storageClassName: longhorn
