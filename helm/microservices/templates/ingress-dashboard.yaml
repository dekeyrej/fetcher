apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ include "microservices.fullname" (dict "Release" .Release "Name" "dashboard-ingress") }}
  labels:
    app: dashboard
spec:
  ingressClassName: {{ .Values.ingress.className | quote }}
  rules:
    - host: {{ .Values.ingress.dashboard.host | quote }}
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: {{ .Values.ingress.dashboard.serviceName | quote }}
                port:
                  number: {{ .Values.ingress.dashboard.port }}
