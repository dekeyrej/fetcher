{{ $root := . }}
{{ range $name, $app := .Values.apps }}
{{ if and $app.enabled $app.port }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "microservices.fullname" (dict "Release" $root.Release "Name" $name) }}
  labels:
    app: {{ $name }}
    environment: {{ $root.Values.env }}
spec:
  type: ClusterIP
  ports:
    - port: {{ $app.port }}
      targetPort: {{ $app.port }}
      protocol: TCP
      name: http
  selector:
    app: {{ $name }}
{{ end }}
{{ end }}

{{- /* transformers typically don't expose services; add if port specified */ -}}
{{ range $tname, $t := .Values.apps.transformers }}
{{ if and $t.enabled $t.port }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "microservices.fullname" (dict "Release" $root.Release "Name" (printf "transformer-%s" $tname)) }}
  labels:
    app: transformer-{{ $tname }}
    environment: {{ $root.Values.env }}
spec:
  type: ClusterIP
  ports:
    - port: {{ $t.port }}
      targetPort: {{ $t.port }}
      protocol: TCP
      name: http
  selector:
    app: transformer-{{ $tname }}
{{ end }}
{{ end }}
