apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ include "microservices.fullname" (dict "Release" .Release "Name" "apiserver-ingress") }}
  annotations:
    nginx.ingress.kubernetes.io/use-regex: "true"
    nginx.ingress.kubernetes.io/rewrite-target: {{ .Values.ingress.apiserver.rewrite | default "/$2" | quote }}
  labels:
    app: apiserver
spec:
  ingressClassName: {{ .Values.ingress.className | quote }}
  rules:
  - host: {{ .Values.ingress.apiserver.host | quote }}
    http:
      paths:
      - path: {{ .Values.ingress.apiserver.path | quote }}
        pathType: Prefix
        backend:
          service:
            name: {{ include "microservices.fullname" (dict "Release" .Release "Name" "apiserver") }}
            port:
              number: {{ .Values.apps.apiserver.port }}
