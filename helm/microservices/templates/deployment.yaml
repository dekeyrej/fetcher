{{- /* Deploy top-level apps (excluding transformers object) */ -}}
{{- $root := . -}}
{{- range $name, $app := .Values.apps -}}
  {{- if and $app.enabled (ne $name "transformers") }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "microservices.fullname" (dict "Release" $root.Release "Name" $name) }}
  labels:
    app: {{ $name }}
    environment: {{ $root.Values.env }}
spec:
  replicas: {{ default 1 $app.replicas }}
  selector:
    matchLabels:
      app: {{ $name }}
  template:
    metadata:
      labels:
        app: {{ $name }}
        environment: {{ $root.Values.env }}
    spec:
      {{- if $app.requiresRedis }}
      initContainers:
        - name: wait-for-redis
          image: redis:7
          imagePullPolicy: IfNotPresent
          command:
            - sh
            - -c
            - |
              until redis-cli -h {{ $root.Values.redis.host }} -p 6379 ping | grep -q PONG; do
                echo "waiting for redis..."
                sleep 2
              done
        {{- if eq $name "repeater" }}
        - name: wait-for-prod-redis
          image: redis:7
          imagePullPolicy: IfNotPresent
          command:
            - sh
            - -c
            - |
              until redis-cli -h {{ $root.Values.redis.externalHost }} -p 6379 ping | grep -q PONG; do
                echo "waiting for prod redis..."
                sleep 2
              done
        {{- end }}
      {{- end }}
      containers:
        - name: {{ $name }}
          image: {{ printf "%s:%s" $app.image.repository (default $root.Values.env $app.image.tag) }}
          imagePullPolicy: Always
          {{- if $app.env }}
          env:
            {{- range $e := $app.env }}
            - name: {{ $e.name }}
              value: {{ $e.value | quote }}
            {{- end }}
          {{- end }}
          {{- if $app.port }}
          ports:
            - containerPort: {{ $app.port }}
          {{- end }}
          {{- if $app.volumeMounts }}
          volumeMounts:
            {{- range $vm := $app.volumeMounts }}
            - name: {{ $vm.name }}
              mountPath: {{ $vm.mountPath }}
              {{- if $vm.subPath }}
              subPath: {{ $vm.subPath }}
              {{- end }}
            {{- end }}
          {{- end }}
          {{- if $app.resources }}
          resources:
            {{ toYaml $app.resources | indent 12 }}
          {{- end }}

      {{- if $root.Values.imagePullSecrets }}
      imagePullSecrets:
        {{- range $s := $root.Values.imagePullSecrets }}
        - name: {{ $s.name }}
        {{- end }}
      {{- end }}

      {{- if $app.volumes }}
      volumes:
        {{- range $v := $app.volumes }}
        - name: {{ $v.name }}
          configMap:
            name: {{ $v.configMap }}
        {{- end }}
      {{- end }}

  {{- end -}}
{{- end -}}

{{- /* Deploy transformers nested under apps.transformers */ -}}
{{- range $tname, $t := .Values.apps.transformers }}
  {{- if $t.enabled }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "microservices.fullname" (dict "Release" $root.Release "Name" (printf "transformer-%s" $tname)) }}
  labels:
    app: transformer-{{ $tname }}
    environment: {{ $root.Values.env }}
spec:
  replicas: {{ default 1 $t.replicas }}
  selector:
    matchLabels:
      app: transformer-{{ $tname }}
  template:
    metadata:
      labels:
        app: transformer-{{ $tname }}
        environment: {{ $root.Values.env }}
    spec:
      initContainers:
        - name: wait-for-redis
          image: redis:7
          imagePullPolicy: IfNotPresent
          command:
            - sh
            - -c
            - |
              until redis-cli -h {{ $root.Values.redis.host }} -p 6379 ping | grep -q PONG; do
                echo "waiting for redis..."
                sleep 2
              done
      containers:
        - name: transformer-{{ $tname }}
          image: {{ printf "%s:%s" $t.image.repository (default $root.Values.env $t.image.tag) }}
          imagePullPolicy: Always
          {{- if $t.env }}
          env:
            {{- range $e := $t.env }}
            - name: {{ $e.name }}
              value: {{ $e.value | quote }}
            {{- end }}
          {{- end }}
          {{- if $t.port }}
          ports:
            - containerPort: {{ $t.port }}
          {{- end }}
          {{- if $t.volumeMounts }}
          volumeMounts:
            {{- range $vm := $t.volumeMounts }}
            - name: {{ $vm.name }}
              mountPath: {{ $vm.mountPath }}
              {{- if $vm.subPath }}
              subPath: {{ $vm.subPath }}
              {{- end }}
            {{- end }}
          {{- end }}
          {{- if $t.resources }}
          resources:
            {{ toYaml $t.resources | indent 12 }}
          {{- end }}

      {{- if $root.Values.imagePullSecrets }}
      imagePullSecrets:
        {{- range $s := $root.Values.imagePullSecrets }}
        - name: {{ $s.name }}
        {{- end }}
      {{- end }}

      {{- if $t.volumes }}
      volumes:
        {{- range $v := $t.volumes }}
        - name: {{ $v.name }}
          configMap:
            name: {{ $v.configMap }}
        {{- end }}
      {{- end }}
  {{- end }}
{{- end }}
