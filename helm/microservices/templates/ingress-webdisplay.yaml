apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ include "microservices.fullname" (dict "Release" .Release "Name" "webdisplay-ingress") }}
  annotations:
    nginx.ingress.kubernetes.io/app-root: /web
  labels:
    app: webdisplay
spec:
  ingressClassName: {{ .Values.ingress.className | quote }}
  rules:
    - host: {{ .Values.ingress.webdisplay.host | quote }}
      http:
        paths:
          - path: {{ .Values.ingress.webdisplay.path | quote }}
            pathType: Prefix
            backend:
              service:
                name: {{ include "microservices.fullname" (dict "Release" .Release "Name" "webdisplay") }}
                port:
                  number: {{ .Values.apps.webdisplay.port }}
