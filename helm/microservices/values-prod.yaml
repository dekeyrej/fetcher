env: prod

apps:
  fetcher:
    enabled: true
  repeater:
    enabled: false
  webdisplay:
    env:
      - name: REACT_APP_API_URL
        value: "http://aragorn.pjis.net/api"
      - name: REACT_APP_CLUSTER_DASHBOARD_URL
        value: "https://dashboard.pjis.net/"
ingress:
  apiserver:
    host: aragorn.pjis.net
  webdisplay:
    host: aragorn.pjis.net
  dashboard:
    host: dashboard.pjis.net
    namespace: kube-system
    serviceName: kubernetes-dashboard
    port: 443

# prod-specific redis overrides
redis:
  host: redis.redis
  image: "redis:7.4-alpine"
  storageClassName: microk8s-hostpath
